# Firebase-Grafana — Docker Compose
#
# Usage:
#   docker compose up -d

services:
  clickhouse:
    build:
      context: ./db/clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - firebase-net

  importer:
    build:
      context: ./importer
    restart: unless-stopped
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ${CREDENTIALS_DIR:-./credentials}:/app/credentials:ro
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-firebase}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - IMPORT_INTERVAL_HOURS=${IMPORT_INTERVAL_HOURS:-6}
    depends_on:
      - clickhouse
    networks:
      - firebase-net

  grafana:
    build:
      context: ./grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning/datasources/clickhouse.yml:/etc/grafana/provisioning/datasources/clickhouse.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - clickhouse
    networks:
      - firebase-net

networks:
  firebase-net:
    driver: bridge
