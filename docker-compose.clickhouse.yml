# ClickHouse overlay
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.clickhouse.yml up -d

services:
  clickhouse:
    build:
      context: ./db/clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - firebase-net

  importer:
    environment:
      - DB_TYPE=clickhouse
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-firebase}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    depends_on:
      - clickhouse

  grafana:
    volumes:
      - ./grafana/provisioning/datasources/clickhouse.yml:/etc/grafana/provisioning/datasources/clickhouse.yml:ro
    depends_on:
      - clickhouse

volumes:
  clickhouse-data:
