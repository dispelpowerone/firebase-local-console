# Firebase Local Console Configuration

apps:
  - name: "DriverTestON"
    project_id: "g1canada"
    credentials_file: "/app/credentials/g1canada-dce38ff17eb0.json"
    dataset: "analytics_347566445"
  - name: "DriverTestBC"
    project_id: "driver-test-bc"
    credentials_file: "/app/credentials/driver-test-bc-649f0c01a418.json"
    dataset: "analytics_406244031"

# Event lists injected into Grafana dashboard SQL at build time.
events:
  ads:
    interstitial:
      displayed: custom_ads_event_displayed
      clicked: custom_ads_event_clicked
    banner: {}
  errors:
    ads:
      - custom_ads_init_failed
      - custom_ads_event_load_failed
      - custom_ads_event_failed_display
      - custom_ads_fback_int_error
    iap:
      - custom_iap_init_failed
      - custom_iap_purchase_failed
      - custom_iap_fetch_failed
      - custom_iap_init_flush_failed
      - custom_iap_error_listener
      - custom_iap_fetch_no_products

import:
  interval_hours: 6
  poll_interval_minutes: 10
  backfill_days: 60
  batch_size: 10000

database:
  clickhouse:
    host: "clickhouse"
    port: 9000
    http_port: 8123
    database: "firebase"
    user: "default"
    password: ""
