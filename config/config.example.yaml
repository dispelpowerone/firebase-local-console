# Firebase Local Console Configuration
# Copy this file to config.yaml and edit with your settings.

# Firebase apps to import.
# Each app has its own GCP project and service account credentials.
# Firebase exports analytics to BigQuery dataset: analytics_<firebase_property_id>
apps:
  - name: "My Android App"
    project_id: "my-gcp-project"
    credentials_file: "/app/credentials/my-project-sa.json"
    dataset: "analytics_123456789"
    # Optional: BQ table prefix override (default: "events_")
    # table_prefix: "events_"

  - name: "My iOS App"
    project_id: "another-gcp-project"
    credentials_file: "/app/credentials/another-project-sa.json"
    dataset: "analytics_987654321"

# Error events used in dashboard queries.
# These lists are injected into Grafana dashboard SQL at build time.
# Add or remove events here to change what counts as an "error" across
# all dashboards — no need to edit individual dashboard JSON files.
error_events:
  ads:
    - custom_ads_init_failed
    - custom_ads_event_load_failed
    - custom_ads_event_failed_display
    - custom_ads_fback_int_error
  iap:
    - custom_iap_init_failed
    - custom_iap_purchase_failed
    - custom_iap_fetch_failed
    - custom_iap_init_flush_failed
    - custom_iap_error_listener
    - custom_iap_fetch_no_products

# Import settings
import:
  # How often to run imports (in hours)
  interval_hours: 6
  # How often to check for new data (in minutes)
  poll_interval_minutes: 10
  # How many days back to look on first import (backfill)
  backfill_days: 30
  # Batch size for BigQuery reads
  batch_size: 10000

# Database settings
database:
  clickhouse:
    host: "clickhouse"
    port: 9000
    http_port: 8123
    database: "firebase"
    user: "default"
    password: ""
