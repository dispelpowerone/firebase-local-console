# Firebase-Grafana Configuration
# Copy this file to config.yaml and edit with your settings.

# Firebase apps to import.
# Each app has its own GCP project and service account credentials.
# Firebase exports analytics to BigQuery dataset: analytics_<firebase_property_id>
apps:
  - name: "My Android App"
    project_id: "my-gcp-project"
    credentials_file: "/app/credentials/my-project-sa.json"
    dataset: "analytics_123456789"
    # Optional: BQ table prefix override (default: "events_")
    # table_prefix: "events_"

  - name: "My iOS App"
    project_id: "another-gcp-project"
    credentials_file: "/app/credentials/another-project-sa.json"
    dataset: "analytics_987654321"

# Import settings
import:
  # How often to run imports (in hours)
  interval_hours: 6
  # How many days back to look on first import (backfill)
  backfill_days: 30
  # Batch size for BigQuery reads
  batch_size: 10000

# Database settings
database:
  # Engine: "clickhouse" or "duckdb"
  type: "clickhouse"

  # ClickHouse connection settings (used when type=clickhouse)
  clickhouse:
    host: "clickhouse"
    port: 9000
    http_port: 8123
    database: "firebase"
    user: "default"
    password: ""

  # DuckDB settings (used when type=duckdb)
  duckdb:
    path: "/data/firebase.duckdb"
