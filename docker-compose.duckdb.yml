# DuckDB overlay
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.duckdb.yml up -d

services:
  duckdb:
    build:
      context: ./db/duckdb
    restart: unless-stopped
    volumes:
      - ./data/duckdb:/data
    networks:
      - firebase-net

  importer:
    environment:
      - DB_TYPE=duckdb
      - DUCKDB_PATH=/data/firebase.duckdb
    volumes:
      - ./data/duckdb:/data
    depends_on:
      - duckdb
